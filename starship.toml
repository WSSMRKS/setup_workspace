palette = "catppuccin_mocha"

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$c\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:base fg:text"

[os.symbols]
Ubuntu = ""
Debian = ""
Arch = ""
Macos = ""
Windows = ""

[username]
show_always = false
style_user = "bg:base fg:subtext1"
style_root = "bg:base fg:red"
format = '[$user ]($style)'

[directory]
style = "bold fg:blue"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""

[git_branch]
symbol = ""
style = "fg:teal"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:peach"
format = '[$all_status$ahead_behind]($style) '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "fg:yellow"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "fg:peach"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "fg:sky"
format = '[ $symbol $version ]($style)'

[c]
symbol = ""
style = "fg:sapphire"
format = '[ $symbol $version ]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:overlay1"
format = '[ 󱦟 $duration ]($style)'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:teal)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
