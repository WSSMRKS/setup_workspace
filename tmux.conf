# ============================================
# Prefix
# ============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================
# General
# ============================================
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10          # critical for vim responsiveness
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # re-number when a window is closed
set -g set-clipboard on

# ============================================
# Key bindings
# ============================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window navigation
bind -r n next-window
bind -r p previous-window

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Kill pane without confirmation
bind x kill-pane

# ============================================
# Copy mode (vi keys)
# ============================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ============================================
# Status bar
# ============================================
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=white"

set -g status-left-length 40
set -g status-left "#[fg=cyan,bold] #S #[fg=white]│ "

set -g status-right-length 60
set -g status-right "#[fg=white]#{?client_prefix,#[fg=yellow]PREFIX ,}#[fg=brightblack]%H:%M "

# Window status
setw -g window-status-format "#[fg=brightblack] #I:#W "
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"

# ============================================
# Plugins (via TPM)
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================================
# Initialize TPM (keep at bottom)
# ============================================
run '~/.tmux/plugins/tpm/tpm'
